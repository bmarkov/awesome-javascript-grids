title: ag-Grid
homeUrl: https://www.ag-grid.com/
demoUrl: https://www.ag-grid.com/example.php
githubRepo: ag-grid/ag-grid
npmPackage: ag-grid-community
license: MIT or Commercial License
revenueModel: Free for Personal Use
description: >
  A feature-rich JavaScript data grid supporting React, Angular, Vue, and vanilla JavaScript, with virtualization, editing, grouping, and aggregation.
frameworks:
  vanilla: true
  react: true
  angular: true
  vue: true
  solid: true
features:
  accessible: true
  copyPaste: Premium feature
  csvExport: Premium feature
  customEditors: true
  customFormatters: true
  draggableRows: true
  editable: true
  fillDown: Premium feature
  fillRight: Premium feature
  filtering: Set filtering is premium, the rest is free
  formulas: Premium feature
  freezableCols: true
  headless: false
  i18n: true
  maintained: true
  mergeCells: true
  openSource: true
  pagination: true
  pdfExport: false
  pivots: Premium feature
  rangeSelection: Premium feature
  resizableCols: true
  responsive: false
  rowGrouping: Premium feature
  rowSelection: true
  serverSide: Premium feature
  sorting: Premium feature
  trees: Premium feature
  typescript: true
  xlsxExport: true
  virtualization: true
