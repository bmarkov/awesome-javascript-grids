title: Kendo UI Grid
homeUrl: https://www.telerik.com/kendo-ui/grid
demoUrl: https://demos.telerik.com/kendo-ui/grid/index
githubRepo: telerik/kendo-ui-core
npmPackage: "@progress/kendo-ui"
license: Custom License
revenueModel: Commercial 30-day Trial
description: >
  An HTML5 and jQuery data grid with 100+ features including paging, sorting, filtering, editing, grouping, virtualization, globalization, RTL, and export to PDF and Excel.
frameworks:
  jquery: true
features:
  accessible: true
  copyPaste: false
  csvExport: false
  customEditors: true
  customFormatters: true
  draggableRows: false
  editable: true
  fillDown: false
  fillRight: false
  filtering: true
  formulas: false
  freezableCols: true
  headless: false
  i18n: true
  maintained: true
  mergeCells: false
  openSource: false
  pagination: true
  pdfExport: true
  pivots: A dedicated PivotGrid widget is available for working with pivot tables.
  rangeSelection: true
  resizableCols: true
  responsive: true
  rowGrouping: true
  rowSelection: true
  serverSide: true
  sorting: true
  trees: A dedicated TreeList widget is available for working with hierarchical data.
  typescript: true
  xlsxExport: true
  virtualization: true
